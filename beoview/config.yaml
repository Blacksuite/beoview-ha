name: Beoview Intercom
version: "0.5.0"
slug: beoview
description: Doorbell, live video, two-way talk, quick replies and door unlock for Beoview / Golmar intercoms with the BWCM.01 Wi-Fi module.
url: https://github.com/Blacksuite/beoview-ha
arch:
  - amd64
  - aarch64
init: false
# Setup panel in the HA sidebar: photograph the QR code from your phone. Admin only.
ingress: true
ingress_port: 8766
panel_icon: mdi:doorbell-video
panel_title: Beoview
panel_admin: true
startup: application
boot: auto
# Mosquitto login comes from the Supervisor: no MQTT settings to fill in.
services:
  - mqtt:need
# Talks to HA core once at start, to register the dashboard card as a resource.
homeassistant_api: true
# Reads its own host IP for WebRTC.
hassio_api: true
map:
  - type: addon_config   # /config: put your own quick-reply clips in replies/
    read_only: false
  - type: homeassistant_config   # /homeassistant: the card is copied to www/beoview/
    read_only: false
options:
  registration_token: ""
schema:
  registration_token: str?
# Only the WebRTC media port faces the LAN (phones need it). Control stays on MQTT;
# go2rtc's API, RTSP and the bridge's HTTP stay on HA's internal network.
ports:
  8555/tcp: 8555
  8555/udp: 8555
ports_description:
  8555/tcp: WebRTC media (video + talk)
  8555/udp: WebRTC media (video + talk)
watchdog: tcp://[HOST]:[PORT:8555]
